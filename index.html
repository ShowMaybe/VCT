<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VCT 电竞经理</title>
<style>
:root{--bg:#0a0f14;--panel:rgba(255,255,255,.03);--line:rgba(255,255,255,.09);--ink:#e9e4dc;--dim:#87919a;--red:#ff4655;--gold:#f5c169;--teal:#2ee6c5;--violet:#b48cff;--blue:#6fb7ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1100px 620px at 80% -10%,rgba(255,70,85,.12),transparent 60%),radial-gradient(900px 500px at 0% 110%,rgba(46,230,197,.05),transparent 60%),#0a0f14;color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,15,20,.92);backdrop-filter:blur(8px);z-index:20;flex-wrap:wrap}
.logo{font-size:15px;font-weight:900;letter-spacing:.16em}
.logo b{color:var(--red)}
.stat{font-size:10.5px;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
.stat b{color:var(--ink);font-size:13px;margin-left:5px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:8px 15px;font-size:12px;letter-spacing:.1em;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{background:#ff5c69}
.btn:disabled{opacity:.35;cursor:not-allowed}
nav{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(10,15,20,.6);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 15px;font-size:12px;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--red)}
main{max-width:1240px;margin:0 auto;padding:16px}
.view{display:none;animation:fade .28s ease both}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.panel{border:1px solid var(--line);background:var(--panel);padding:14px 16px;margin-bottom:12px}
.pane-title{font-size:9.5px;letter-spacing:.3em;color:#6f7b82;margin-bottom:10px;font-weight:700;text-transform:uppercase}
h2{font-size:20px;letter-spacing:.05em}
.hint{font-size:11.5px;color:var(--dim);line-height:1.85}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

/* 开档 */
.origin{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.o-card{border:1px solid var(--line);padding:14px;cursor:pointer;transition:.15s;background:rgba(255,255,255,.02)}
.o-card:hover{border-color:rgba(255,70,85,.5);background:rgba(255,70,85,.06)}
.o-card.on{border-color:var(--red);background:rgba(255,70,85,.1)}
.o-card .t{font-size:14px;font-weight:800}
.o-card .rep{font-size:11px;color:var(--gold);margin-left:8px}
.o-card .d{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.7}
.tagrow{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10px;border:1px solid rgba(255,255,255,.18);padding:2px 7px;color:#b9c3c9}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:340px;overflow:auto}
.team{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:9px 11px;cursor:pointer}
.team:hover,.team.on{border-color:rgba(255,70,85,.55);background:rgba(255,70,85,.07)}
.badge{width:38px;height:34px;display:grid;place-items:center;font-size:9.5px;font-weight:900;background:rgba(255,255,255,.06);border:1px solid var(--line);flex:0 0 auto}
.team .nm{font-size:12.5px;font-weight:700}
.team .sub{font-size:9.5px;color:var(--dim);margin-top:2px}
.rating{margin-left:auto;font-size:16px;font-weight:900}
input[type=text]{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);padding:8px 10px;font-family:inherit;font-size:13px;width:200px}

/* 选手卡 */
.player{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:10px;cursor:pointer;transition:.15s}
.player:hover{border-color:rgba(255,255,255,.3)}
.player.sel{outline:2px solid var(--red);outline-offset:1px}
.player .top{display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;display:grid;place-items:center;font-weight:900;font-size:13px;background:#111a20;border:1px solid var(--line);flex:0 0 auto}
.player .nm{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .sub{font-size:9px;color:var(--dim);margin-top:1px}
.ovr{position:absolute;top:8px;right:10px;font-size:16px;font-weight:900}
.bars{margin-top:8px;display:grid;gap:4px}
.prow{display:grid;grid-template-columns:30px 1fr 24px;gap:5px;align-items:center;font-size:9px;color:var(--dim)}
.prow .bar{height:2.5px;background:rgba(255,255,255,.08)}
.prow .bar i{display:block;height:100%;background:var(--teal)}
.prow b{text-align:right;color:var(--ink);font-weight:600;font-size:9px}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}

/* 训练 */
.train-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.t-opt{border:1px solid var(--line);padding:13px;cursor:pointer;background:rgba(255,255,255,.02)}
.t-opt:hover{border-color:rgba(255,70,85,.5)}
.t-opt.on{border-color:var(--red);background:rgba(255,70,85,.1)}
.t-opt .t{font-size:13px;font-weight:800}
.t-opt .d{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.7}
.duo{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.duo .chip{border:1px solid var(--line);padding:5px 9px;font-size:11px;cursor:pointer}
.duo .chip.on{border-color:var(--teal);color:var(--teal)}

/* 战术 */
.slider{margin-bottom:14px}
.slider .lab{display:flex;justify-content:space-between;font-size:11.5px;color:#b9c3c9;margin-bottom:5px}
.slider input{width:100%;accent-color:var(--red)}
.maprow{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:11px;color:#b9c3c9;margin-bottom:7px}
.maprow .bar{height:4px;background:rgba(255,255,255,.08)}
.maprow .bar i{display:block;height:100%;background:var(--blue)}
.maprow b{text-align:right;font-variant-numeric:tabular-nums}

/* 赛程 */
.standings{width:100%;border-collapse:collapse;font-size:11.5px}
.standings th{font-size:9px;letter-spacing:.16em;color:#6f7b82;text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)}
.standings td{padding:6px 7px;border-bottom:1px solid rgba(255,255,255,.05);color:#c9d2d6}
.standings tr.me td{color:var(--gold);font-weight:700}
.standings td.num{text-align:right;font-variant-numeric:tabular-nums}
.mlog{font-size:12px;line-height:1.95;color:#c6cfd4;min-height:20px}
.mlog .win{color:var(--teal)}.mlog .lose{color:#ff8a95}

/* 转会 */
.market{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:9px 11px}
.mrow .nm{font-size:12px;font-weight:700}
.mrow .sub{font-size:9.5px;color:var(--dim);margin-top:2px}
.mrow .price{font-size:11px;color:var(--gold);text-align:right;white-space:nowrap}

/* 更衣室 */
.relgrid{display:grid;gap:2px;font-size:9px;overflow:auto;justify-content:start}
.relcell{height:30px;display:grid;place-items:center;background:rgba(255,255,255,.04);color:#8b959c;min-width:0;border-radius:2px}
.relhead{height:30px;display:flex;align-items:center;font-size:9px;color:#6f7b82;padding:0 3px;white-space:nowrap;overflow:hidden}
.mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.mcard{border:1px solid var(--line);padding:9px 11px;font-size:11px}
.mcard .n{font-weight:700;font-size:12px;margin-bottom:4px}
.mcard .r{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;margin-top:2px}
.mcard .r b{color:var(--ink)}
.bad{color:#ff8a95}.good{color:var(--teal)}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(4,7,10,.88);display:none;place-items:center;padding:18px;z-index:50;overflow:auto}
.modal.on{display:grid}
.modal-box{width:min(560px,100%);border:1px solid var(--line);background:#0d1419;padding:22px}
.modal-box h2{font-size:18px;margin-bottom:12px}
.modal-box p{font-size:12.5px;line-height:1.95;color:#c6cfd4}
</style>
</head>
<body>
<header>
  <div class="logo">VCT <b>电竞经理</b></div>
  <div class="stat">预算<b id="h-budget">—</b></div>
  <div class="stat">赛季<b id="h-season">—</b></div>
  <div class="stat">轮次<b id="h-round">—</b></div>
  <div class="stat">战绩<b id="h-record">—</b></div>
  <div class="stat">董事会<b id="h-trust">—</b></div>
  <div class="stat">声望<b id="h-rep">—</b></div>
  <div class="spacer"></div>
  <button class="btn" id="btn-restart">重开</button>
</header>

<nav id="nav">
  <button class="on" data-view="squad">阵容</button>
  <button data-view="train">训练</button>
  <button data-view="tactics">战术</button>
  <button data-view="season">赛程</button>
  <button data-view="market">转会</button>
  <button data-view="room">更衣室</button>
</nav>

<main>
  <!-- 开档 -->
  <section class="view on" id="view-pick">
    <div class="panel">
      <h2>开档</h2>
      <div class="hint" style="margin-top:6px">选名字、出身、球队。声望决定哪些队愿意请你。</div>
      <div class="row" style="margin-top:14px">
        <span class="hint">名字</span><input type="text" id="in-name" placeholder="你的名字" maxlength="12" />
        <span class="hint">年龄</span>
        <div class="row" id="age-row">
          <button class="btn" data-age="young">青年</button>
          <button class="btn" data-age="mid">中年</button>
          <button class="btn" data-age="old">资深</button>
        </div>
      </div>
      <div class="pane-title" style="margin-top:18px">出身 · 三选一</div>
      <div class="origin" id="origins"></div>
      <div class="pane-title" style="margin-top:18px">选择战队</div>
      <div class="team-grid" id="teams"></div>
      <div class="row" style="margin-top:18px">
        <span class="hint">难度</span>
        <div class="row" id="diff-row">
          <button class="btn" data-diff="normal">普通</button>
          <button class="btn" data-diff="hard">困难</button>
          <button class="btn" data-diff="pro">职业</button>
        </div>
        <div class="spacer"></div>
        <button class="btn primary" id="btn-start" disabled>开始职业生涯 →</button>
      </div>
      <div class="hint" id="pick-hint" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- 阵容 -->
  <section class="view" id="view-squad">
    <div class="panel">
      <div class="row"><div class="pane-title" style="margin:0">首发五人</div><div class="spacer"></div><div class="hint" id="sq-power"></div></div>
      <div class="lineup" id="lineup" style="margin-top:10px"></div>
    </div>
    <div class="panel">
      <div class="pane-title">替补 / 名单</div>
      <div class="bench" id="bench"></div>
    </div>
  </section>

  <!-- 训练 -->
  <section class="view" id="view-train">
    <div class="panel">
      <div class="pane-title">本周主训练 · 三选一</div>
      <div class="train-grid" id="train-opts"></div>
      <div class="hint" id="train-state" style="margin-top:10px"></div>
    </div>
    <div class="panel">
      <div class="pane-title">双排练 · 选两个人加练（提升关系）</div>
      <div class="duo" id="duo"></div>
      <div class="hint" style="margin-top:8px">协同、沟通涨经验，两人关系 +3~6。不占主训练位置。</div>
    </div>
    <div class="panel">
      <div class="pane-title">个人训练重点</div>
      <div id="focus-list"></div>
    </div>
  </section>

  <!-- 战术 -->
  <section class="view" id="view-tactics">
    <div class="grid2">
      <div class="panel">
        <div class="pane-title">战术滑杆</div>
        <div id="sliders"></div>
        <div class="hint" id="shape-hint" style="margin-top:6px"></div>
      </div>
      <div class="panel">
        <div class="pane-title">地图熟练度</div>
        <div id="maps"></div>
        <div class="hint" style="margin-top:6px">跑图一周 +12；正式比赛 +8；50 为中立，进比赛按 (熟练度−50)×0.06 加成。</div>
      </div>
    </div>
  </section>

  <!-- 赛程 -->
  <section class="view" id="view-season">
    <div class="panel">
      <div class="row"><div><div class="pane-title" style="margin:0">本轮</div><div id="round-title" style="font-size:20px;font-weight:900;margin-top:4px"></div></div>
        <div class="spacer"></div><div id="round-actions"></div></div>
      <div class="mlog" id="mlog" style="margin-top:10px"></div>
    </div>
    <div class="panel">
      <div class="pane-title">积分榜</div>
      <table class="standings"><thead><tr><th>战队</th><th style="text-align:right">胜</th><th style="text-align:right">负</th><th style="text-align:right">胜率</th></tr></thead><tbody id="standings"></tbody></table>
    </div>
  </section>

  <!-- 转会 -->
  <section class="view" id="view-market">
    <div class="panel">
      <div class="pane-title">转会市场</div>
      <div class="hint" id="market-hint"></div>
      <div class="market" id="market" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- 更衣室 -->
  <section class="view" id="view-room">
    <div class="panel">
      <div class="pane-title">关系矩阵</div>
      <div class="relgrid" id="relgrid"></div>
      <div class="hint" style="margin-top:8px">两两关系 −100~+100，全队默契是平均值。输球时「一个人扛」会扣关系。</div>
    </div>
    <div class="panel">
      <div class="pane-title">选手状态</div>
      <div class="mood" id="mood"></div>
    </div>
  </section>
</main>

<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>

const MAPS = ['亚海悬城','源工重镇','隐世修所','霓虹町','森寒冬港','微风岛屿','裂变峡谷'];
const ROLE_COLOR = { '决斗者':'#ff4655', '先锋':'#f5c169', '控场':'#b48cff', '哨卫':'#2ee6c5' };
const ATTRS = [['aim','枪法'],['reaction','反应'],['awareness','意识'],['utility','道具'],['clutch','残局'],['teamwork','团队'],['communication','沟通'],['igl','指挥']];
const ORIGINS = [
  { id:'grass', name:'草根出身', rep:-8, desc:'从网吧路人一路打杂上来，什么都自学，只是没人听过你的名字。', tags:['训练','带新人','商务'], bonus:{train:1.2} },
  { id:'pro', name:'退役职业选手', rep:12, desc:'你在赛场上待过，选手信你说的话，但从没管过账。', tags:['更衣室','战术','商务'], bonus:{room:1.2} },
  { id:'coach', name:'前教练 / 助教', rep:9, desc:'你在教练席上熬了很多年，懂训练也懂临场，只是不擅长跟人谈钱。', tags:['战术','训练','谈判'], bonus:{tactic:1.2} }
];
const SAVE='vct.manager.v2';
const PMAP={}; PLAYERS.forEach(p=>PMAP[p.id]=p);
const TMAP={}; TEAMS.forEach(t=>TMAP[t.id]=t);
const LEAGUES=[...new Set(TEAMS.map(t=>t.league))];

let S=null;
let ui={view:'squad', origin:null, team:null, age:'young', diff:'normal', selStarter:null, duo:[], focus:{}};

/* ---------- 工具 ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const money=n=>Math.round(n).toLocaleString('zh-CN');
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE);if(r)return JSON.parse(r);}catch(e){}return null;}

/* ---------- 开档 ---------- */
function ghostInit(){
  const box=document.getElementById('origins');
  box.innerHTML=ORIGINS.map(o=>`<div class="o-card" data-o="${o.id}"><div class="t">${o.name}<span class="rep">${o.rep>0?'+':''}${o.rep} 声望</span></div><div class="d">${o.desc}</div><div class="tagrow">${o.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`).join('');
  box.querySelectorAll('.o-card').forEach(el=>el.onclick=()=>{
    ui.origin=el.dataset.o;
    box.querySelectorAll('.o-card').forEach(x=>x.classList.toggle('on',x===el));
    renderTeams(); updateStart();
  });
  document.querySelectorAll('#age-row button').forEach(b=>b.onclick=()=>{
    ui.age=b.dataset.age;
    document.querySelectorAll('#age-row button').forEach(x=>x.classList.toggle('on',x===b));
    renderTeams(); updateStart();
  });
  document.querySelectorAll('#diff-row button').forEach(b=>b.onclick=()=>{
    ui.diff=b.dataset.diff;
    document.querySelectorAll('#diff-row button').forEach(x=>x.classList.toggle('on',x===b));
  });
  document.querySelector('#age-row button').classList.add('on');
  document.querySelector('#diff-row button').classList.add('on');
  renderTeams(); updateStart();
}
function repOf(){const o=ORIGINS.find(x=>x.id===ui.origin);return o?o.rep:0;}
function ageBonus(){return ui.age==='young'?-6:ui.age==='mid'?0:8;}
function renderTeams(){
  const my=repOf()+ageBonus();
  const list=TEAMS.slice().sort((a,b)=>b.rating-a.rating);
  const box=document.getElementById('teams');
  box.innerHTML=list.map(t=>{
    const ok=t.rating<=62+my*1.2;
    return `<div class="team ${ui.team===t.id?'on':''}" data-t="${t.id}" style="opacity:${ok?1:.35}">
      <div class="badge">${t.tag}</div>
      <div><div class="nm">${t.name}</div><div class="sub">${t.league} · ${ok?'愿意请你':'看不上你'}</div></div>
      <div class="rating">${t.rating}</div></div>`;
  }).join('');
  box.querySelectorAll('.team').forEach(el=>{
    el.onclick=()=>{
      const t=TMAP[el.dataset.t];
      if(t.rating>62+my*1.2){document.getElementById('pick-hint').textContent='这家俱乐部看不上你现在的声望，先从小球队做起。';return;}
      ui.team=t.id;
      box.querySelectorAll('.team').forEach(x=>x.classList.toggle('on',x===el));
      updateStart();
    };
  });
}
function updateStart(){
  const ok=ui.origin&&ui.team;
  document.getElementById('btn-start').disabled=!ok;
  document.getElementById('pick-hint').textContent=ok?'':'选好出身和战队才能开始。';
}

function startGame(){
  const t=TMAP[ui.team];
  const o=ORIGINS.find(x=>x.id===ui.origin);
  S={
    name:document.getElementById('in-name').value.trim()||'无名氏',
    origin:o, teamId:t.id, league:t.league,
    season:1, round:0, phase:'regular',
    budget:Math.round(t.budget/10000),
    rep:clamp(40+o.rep,5,96),
    trust:60,
    difficulty:ui.diff,
    roster:t.roster.slice(),
    starters:t.roster.slice(0,5),
    dyn:{}, rel:{},
    maps:{}, sliders:{tempo:50,aggr:50,util:50,mid:50},
    standings:{}, played:[], trained:null,
    log:[]
  };
  t.roster.forEach(id=>S.dyn[id]=mkDyn(id));
  LEAGUE_TEAMS(t.league).forEach(x=>S.standings[x.id]={w:0,l:0});
  initMaps();
  initRelations();
  save();
  hud();
  switchView('squad');
}
function mkDyn(id){
  const p=PMAP[id];
  return {ovr:p.overall,pot:p.potential,form:p.form,morale:p.morale,fatigue:p.fatigue,
    trust:clamp(62+randn()*8,30,95),loyal:clamp((p.loyalty??50),20,95),griev:clamp(50-p.morale/2,0,60),
    contract:p.contractYears||2, age:p.age, salary:p.salary, value:p.value};
}
function initMaps(){ MAPS.forEach(m=>S.maps[m]={fam:50}); }
function initRelations(){
  const ids=S.roster;
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const a=PMAP[ids[i]],b=PMAP[ids[j]];
    let v=40+randn()*8;
    if(a.nat===b.nat)v+=4; else v-=2;
    if(Math.abs(a.age-b.age)<=2)v+=3; else if(Math.abs(a.age-b.age)>=7)v-=2;
    if((a.role==='决斗者'&&b.role==='先锋')||(a.role==='控场'&&b.role==='哨卫'))v+=3;
    S.rel[key(ids[i],ids[j])]=clamp(v,-100,100);
  }
}
const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const relOf=(a,b)=>S.rel[key(a,b)]??30;

function LEAGUE_TEAMS(lg){return TEAMS.filter(t=>t.league===lg);}

/* ---------- 战力 ---------- */
function teamPower(ids,dynMap){
  const d=ids.map(id=>(dynMap||S.dyn)[id]).filter(Boolean);
  if(!d.length)return 50;
  const avg=k=>d.reduce((a,x)=>a+x[k],0)/d.length;
  return avg('ovr')*0.55+avg('form')*0.15+avg('morale')*0.08-avg('fatigue')*0.12;
}
function aiPower(tid){
  const t=TMAP[tid];
  const ps=t.roster.slice(0,5).map(id=>PMAP[id]).filter(Boolean);
  const avg=k=>ps.reduce((a,p)=>a+p[k],0)/ps.length;
  let base=avg('overall')*0.55+avg('form')*0.15+avg('morale')*0.08-avg('fatigue')*0.12;
  base+=(t.coach.tactics||70)*0.06;
  if(S.difficulty==='hard')base+=2.5;
  if(S.difficulty==='pro')base+=5;
  return base;
}
function shapeOf(ids){
  const roles=ids.map(id=>PMAP[id]&&PMAP[id].role);
  const c=r=>roles.filter(x=>x===r).length;
  if(c('决斗者')>=2)return '双决斗';
  if(c('哨卫')>=2)return '双哨卫';
  if(c('控场')>=2)return '双控场';
  return '标准';
}
function tacBonus(map){
  const sh=shapeOf(S.starters);
  const s=S.sliders;
  let atk=0,def=0;
  atk+=(s.tempo-50)*0.035; def-=(s.tempo-50)*0.022;
  atk+=(s.aggr-50)*0.028; def-=(s.aggr-50)*0.015;
  const utilAttr=avgUtil();
  const util=(s.util-50)*0.02*(0.5+utilAttr/130);
  atk+=util; def+=util;
  def+=(s.mid-50)*0.02;
  if(sh==='双决斗'){atk*=1.35;def*=0.8;}
  if(sh==='双哨卫'){atk*=0.5;def*=2.2;}
  if(sh==='双控场'){atk+=0.5;def+=0.5;atk*=1.2;def*=1.2;}
  const fam=((S.maps[map]||{fam:50}).fam-50)*0.06;
  return (atk+def)/2+fam;
}
function avgUtil(){
  const d=S.starters.map(id=>S.dyn[id]).filter(Boolean);
  if(!d.length)return 60;
  const ps=S.starters.map(id=>PMAP[id]).filter(Boolean);
  return ps.reduce((a,p)=>a+(p.attrs?.utility||60),0)/ps.length;
}
function chemistry(){
  const ids=S.starters;
  let sum=0,n=0;
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){sum+=relOf(ids[i],ids[j]);n++;}
  return n?sum/n:30;
}
function matchPower(map,oppId){
  const base=teamPower(S.starters);
  const chem=(chemistry()-10)*0.18;
  const tac=tacBonus(map);
  const coach=(TMAP[S.teamId].coach.tactics||70)*0.06;
  const idg=S.starters.some(id=>PMAP[id]&&PMAP[id].isIgl)?0:-4;
  return base+chem+tac+coach+idg;
}

/* ---------- 训练 ---------- */
function applyTraining(kind,payload){
  const d=S.starters.map(id=>S.dyn[id]).filter(Boolean);
  if(kind==='run'){
    const m=payload.map;
    S.maps[m].fam=clamp(S.maps[m].fam+12,0,100);
    d.forEach(x=>{x.fatigue=clamp(x.fatigue+5,0,100);});
  }else if(kind==='review'){
    d.forEach(x=>{x.form=clamp(x.form+3,20,99);x.fatigue=clamp(x.fatigue+2,0,100);});
  }else if(kind==='rest'){
    d.forEach(x=>{x.fatigue=clamp(x.fatigue-14,0,100);x.morale=clamp(x.morale+2,20,99);});
  }
  if(ui.duo.length===2){
    const [a,b]=ui.duo;
    S.rel[key(a,b)]=clamp(relOf(a,b)+rnd(3,6),-100,100);
    [a,b].forEach(id=>{const x=S.dyn[id];if(x){x.form=clamp(x.form+2,20,99);x.fatigue=clamp(x.fatigue+3,0,100);}});
    ui.duo=[];
  }
  // 个人训练重点
  Object.entries(ui.focus).forEach(([id,attr])=>{
    const x=S.dyn[id]; const p=PMAP[id];
    if(!x||!p)return;
    if(attr==='rest'){x.fatigue=clamp(x.fatigue-6,0,100);}
    else{x.ovr=clamp(x.ovr+ (Math.random()<0.4?1:0),30,99);x.fatigue=clamp(x.fatigue+4,0,100);}
  });
  ui.focus={};
  S.trained=kind;
}

/* ---------- 比赛 ---------- */
async function playMatch(){
  if(S.phase!=='regular')return;
  const opp=currentOpponent();
  if(!opp)return;
  const log=document.getElementById('mlog');
  log.innerHTML='<div class="hint">比赛开始…</div>';
  const maps=MAPS.slice().sort(()=>Math.random()-0.5).slice(0,3);
  let mine=0,theirs=0;
  const oppP=aiPower(opp);
  for(let i=0;i<maps.length&&mine<2&&theirs<2;i++){
    await sleep(360);
    const a=matchPower(maps[i])+randn()*5;
    const b=oppP+randn()*5;
    const win=a>b;
    if(win)mine++;else theirs++;
    log.insertAdjacentHTML('beforeend',`<div><span style="color:#5a656b">${maps[i]}</span> · ${win?'<span class="win">胜</span>':'<span class="lose">负</span>'} <span style="color:#5a656b">(${Math.round(a)} : ${Math.round(b)})</span></div>`);
    S.maps[maps[i]].fam=clamp(S.maps[maps[i]].fam+8,0,100);
  }
  log.querySelector('.hint')?.remove();
  const win=mine>theirs;
  S.round++;S.played.push(opp);S.trained=null;ui.trainKind=null;
  S.standings[S.teamId][win?'w':'l']++;
  const d=S.starters.map(id=>S.dyn[id]).filter(Boolean);
  d.forEach(x=>{
    x.form=clamp(x.form+(win?3:-3)+randn()*2,20,99);
    x.morale=clamp(x.morale+(win?5:-5),20,99);
    x.fatigue=clamp(x.fatigue+8,0,100);
    x.trust=clamp(x.trust+(win?0.35:-0.5),0,100);
  });
  S.trust=clamp(S.trust+(win?4:-5),0,100);
  S.rep=clamp(S.rep+(win?0.4:-0.2),5,96);
  // 输球：一个人扛 → 关系下降
  if(!win){
    const scores=S.starters.map(id=>S.dyn[id].form);
    const mx=Math.max(...scores),mi=Math.min(...scores);
    if(mx-mi>18){
      const carry=S.starters[scores.indexOf(mx)];
      S.starters.forEach(other=>{
        if(other!==carry) S.rel[key(carry,other)]=clamp(relOf(carry,other)-rnd(2,6),-100,100);
      });
    }
  }
  simulateOthers();
  save();
  log.insertAdjacentHTML('beforeend',`<div style="margin-top:8px;font-size:14px">${win?'<span class="win">'+mine+' : '+theirs+' 赢下比赛</span>':'<span class="lose">'+mine+' : '+theirs+' 输掉比赛</span>'}</div>`);
  renderSeason();
  if(S.trust<15){gameOver('董事会失去了耐心，你被解雇了。');}
}

function currentOpponent(){
  const pool=LEAGUE_TEAMS(S.league).filter(t=>t.id!==S.teamId&&!S.played.includes(t.id));
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)].id;
}
function simulateOthers(){
  const teams=LEAGUE_TEAMS(S.league).filter(t=>t.id!==S.teamId);
  const sh=teams.slice().sort(()=>Math.random()-0.5);
  for(let i=0;i+1<sh.length;i+=2){
    const a=sh[i],b=sh[i+1];
    const aw=aiPower(a.id)+randn()*6>aiPower(b.id)+randn()*6;
    S.standings[a.id][aw?'w':'l']++;
    S.standings[b.id][aw?'w':'l']++;
  }
}
function sortedStandings(){
  return Object.entries(S.standings).map(([id,r])=>({id,...r})).sort((a,b)=>b.w-a.w||a.l-b.l);
}

/* ---------- 赛季 ---------- */
function enterPlayoffs(){
  const table=sortedStandings();
  const top4=table.slice(0,4);
  const inTop=top4.some(t=>t.id===S.teamId);
  S.phase='playoff';
  if(!inTop){S.phase='offseason';showModal(`<h2>赛季结束</h2><p>常规赛第 ${table.findIndex(t=>t.id===S.teamId)+1} 名，无缘季后赛。</p><div style="margin-top:14px;text-align:right"><button class="btn primary" onclick="offseason()">进入休赛期</button></div>`);return;}
  // 半决赛 & 决赛
  (async()=>{
    const log=document.getElementById('mlog');
    log.innerHTML='';
    const pairs=[[top4[0],top4[3]],[top4[1],top4[2]]];
    let finalists=[];
    for(const [a,b] of pairs){
      if(a.id===S.teamId||b.id===S.teamId){
        const opp=(a.id===S.teamId?b:a).id;
        const maps=MAPS.slice().sort(()=>Math.random()-0.5).slice(0,3);
        let mine=0,theirs=0;
        for(let i=0;i<maps.length&&mine<2&&theirs<2;i++){
          await sleep(300);
          const x=matchPower(maps[i])+randn()*5,y=aiPower(opp)+randn()*5;
          if(x>y)mine++;else theirs++;
          log.insertAdjacentHTML('beforeend',`<div>半决赛 · ${maps[i]} · ${x>y?'<span class="win">胜</span>':'<span class="lose">负</span>'}</div>`);
        }
        if(mine>theirs){finalists.push({id:S.teamId});log.insertAdjacentHTML('beforeend','<div style="margin:8px 0"><b>晋级决赛</b></div>');}
        else{S.phase='offseason';showModal(`<h2>止步四强</h2><p>半决赛 ${mine} : ${theirs} 出局。</p><div style="margin-top:14px;text-align:right"><button class="btn primary" onclick="offseason()">进入休赛期</button></div>`);return;}
      }else{
        finalists.push(aiPower(a.id)+randn()*6>aiPower(b.id)+randn()*6?a:b);
      }
    }
    const opp=finalists.find(f=>f.id!==S.teamId);
    const maps=MAPS.slice().sort(()=>Math.random()-0.5).slice(0,3);
    let mine=0,theirs=0;
    for(let i=0;i<maps.length&&mine<2&&theirs<2;i++){
      await sleep(300);
      const x=matchPower(maps[i])+randn()*5,y=aiPower(opp.id)+randn()*5;
      if(x>y)mine++;else theirs++;
      log.insertAdjacentHTML('beforeend',`<div>决赛 · ${maps[i]} · ${x>y?'<span class="win">胜</span>':'<span class="lose">负</span>'}</div>`);
    }
    S.champion=mine>theirs;
    S.phase='offseason';
    if(S.champion){S.rep=clamp(S.rep+4,5,96);S.trust=clamp(S.trust+15,0,100);}
    showModal(`<h2>${S.champion?'冠军':'亚军'}</h2><p>决赛 ${mine} : ${theirs}，${S.champion?'拿下了赛区冠军。':'差一步。'}</p><div style="margin-top:14px;text-align:right"><button class="btn primary" onclick="offseason()">进入休赛期</button></div>`);
  })();
}

function offseason(){
  const wins=S.standings[S.teamId].w;
  const prize=(S.champion?300:60)+wins*8;
  const salary=S.roster.reduce((a,id)=>a+((S.dyn[id]?.salary||0)/10000),0);
  S.budget=Math.max(0,Math.round(S.budget+prize-salary));
  // 合同/年龄/成长
  const left=[];
  S.roster.slice().forEach(id=>{
    const x=S.dyn[id];if(!x)return;
    x.contract--;x.age++;
    let g=0;
    if(x.age<=20)g=1+Math.random()*3;
    else if(x.age<=23)g=0.5+Math.random()*2;
    else if(x.age>=29)g=-(1+Math.random()*2);
    x.ovr=clamp(x.ovr+g,30,99);
    if(x.contract<=0){left.push(PMAP[id].ign);S.roster=S.roster.filter(y=>y!==id);S.starters=S.starters.filter(y=>y!==id);}
  });
  S.season++;S.round=0;S.played=[];S.phase='regular';S.trained=null;
  LEAGUE_TEAMS(S.league).forEach(t=>S.standings[t.id]={w:0,l:0});
  save();
  showModal(`<h2>第 ${S.season-1} 赛季结算</h2><p>奖金 +${Math.round(prize)} 万，工资 -${Math.round(salary)} 万，预算 ${money(S.budget)} 万。<br>合同到期离队：${left.length?left.join('、'):'无'}</p><div style="margin-top:14px;text-align:right"><button class="btn primary" onclick="closeModal();switchView('market')">去转会市场</button></div>`);
  renderAll();
}

function gameOver(msg){
  S=null;localStorage.removeItem(SAVE);
  showModal(`<h2>职业生涯结束</h2><p>${msg}</p><div style="margin-top:14px;text-align:right"><button class="btn primary" onclick="location.reload()">重新开始</button></div>`);
}

/* ---------- 渲染 ---------- */
function switchView(v){
  if(!S)return;
  ui.view=v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.getElementById('view-'+v).classList.add('on');
  if(v==='squad')renderSquad();
  if(v==='train')renderTrain();
  if(v==='tactics')renderTactics();
  if(v==='season')renderSeason();
  if(v==='market')renderMarket();
  if(v==='room')renderRoom();
}
function renderAll(){
  if(!S){document.getElementById('view-pick').classList.add('on');hud();return;}
  hud();renderSquad();renderTrain();renderTactics();renderSeason();renderMarket();renderRoom();
  switchView(ui.view);
}
function hud(){
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  if(!S){set('h-budget','—');set('h-season','—');set('h-round','—');set('h-record','—');set('h-trust','—');set('h-rep','—');return;}
  set('h-budget',money(S.budget)+' 万');
  set('h-season','S'+S.season);
  set('h-round',S.phase==='regular'?(S.round+1)+' / '+(LEAGUE_TEAMS(S.league).length-1):'—');
  const r=S.standings[S.teamId]||{w:0,l:0};
  set('h-record',r.w+'-'+r.l);
  set('h-trust',Math.round(S.trust));
  set('h-rep',Math.round(S.rep));
}

function pc(id){
  const p=PMAP[id],d=S.dyn[id];
  if(!p||!d)return '';
  const c=ROLE_COLOR[p.role]||'#888';
  const sel=ui.selStarter===id?' sel':'';
  return `<div class="player${sel}" data-id="${id}">
    <div class="ovr" style="color:${c}">${Math.round(d.ovr)}</div>
    <div class="top"><div class="avatar" style="color:${c}">${p.ign.slice(0,2).toUpperCase()}</div>
      <div><div class="nm">${p.ign}</div><div class="sub">${p.role} · ${d.age} 岁 · 合同 ${d.contract} 年</div></div></div>
    <div class="bars">${pr('状态',d.form)}${pr('士气',d.morale)}${pr('体能',100-d.fatigue)}${pr('信任',d.trust)}</div></div>`;
}
function pr(l,v){return `<div class="prow"><span>${l}</span><div class="bar"><i style="width:${clamp(v,0,100)}%"></i></div><b>${Math.round(v)}</b></div>`;}

function renderSquad(){
  if(!S)return;
  const line=document.getElementById('lineup');
  line.innerHTML=S.starters.map(pc).join('');
  line.querySelectorAll('.player').forEach(el=>el.onclick=()=>{
    ui.selStarter=ui.selStarter===el.dataset.id?null:el.dataset.id;renderSquad();
  });
  const bench=document.getElementById('bench');
  const subs=S.roster.filter(id=>!S.starters.includes(id));
  bench.innerHTML=subs.length?subs.map(pc).join(''):'<div class="hint">没有替补。</div>';
  bench.querySelectorAll('.player').forEach(el=>el.onclick=()=>{
    const id=el.dataset.id;
    if(ui.selStarter){S.starters=S.starters.map(x=>x===ui.selStarter?id:x);ui.selStarter=null;}
    else if(S.starters.length<5)S.starters.push(id);
    save();renderSquad();hud();
  });
  document.getElementById('sq-power').innerHTML='首发战力 <b style="color:var(--gold)">'+Math.round(teamPower(S.starters))+'</b> · 默契 <b style="color:var(--teal)">'+Math.round(chemistry())+'</b> · '+shapeOf(S.starters);
}

function renderTrain(){
  if(!S)return;
  const box=document.getElementById('train-opts');
  const opts=[
    {k:'run',t:'跑图',d:'选一张图，熟练度 +12，全队疲劳 +5'},
    {k:'review',t:'教练复盘',d:'全队状态 +3，疲劳 +2'},
    {k:'rest',t:'体能恢复',d:'全队疲劳 -14，士气 +2'}
  ];
  box.innerHTML=opts.map(o=>`<div class="t-opt" data-k="${o.k}"><div class="t">${o.t}</div><div class="d">${o.d}</div></div>`).join('')
    + (ui.trainKind==='run'?`<div style="grid-column:1/-1;margin-top:6px">${mapPicker()}</div>`:'');
  box.querySelectorAll('.t-opt').forEach(el=>el.onclick=()=>{
    ui.trainKind=el.dataset.k;
    if(el.dataset.k==='run'){renderTrain();return;}
    if(S.trained){document.getElementById('train-state').textContent='本周已经训练过了。';return;}
    applyTraining(ui.trainKind);save();
    document.getElementById('train-state').textContent='本周训练完成：'+el.querySelector('.t').textContent;
    renderTrain();
  });
  if(ui.trainKind==='run'){
    document.querySelectorAll('[data-map]').forEach(m=>m.onclick=()=>{
      ui.trainMap=m.dataset.map;
      if(S.trained){document.getElementById('train-state').textContent='本周已经训练过了。';return;}
      applyTraining('run',{map:ui.trainMap});save();
      document.getElementById('train-state').textContent='本周训练完成：跑图 '+ui.trainMap;
      renderTrain();renderTactics();
    });
  }
  document.getElementById('train-state').textContent=S.trained?('本周已训练：'+({run:'跑图',review:'教练复盘',rest:'体能恢复'}[S.trained]||S.trained)):'本周还没训练（也可以直接打比赛，但没有加成）';

  const duo=document.getElementById('duo');
  duo.innerHTML=S.roster.map(id=>{
    const on=ui.duo.includes(id);
    return `<div class="chip${on?' on':''}" data-duo="${id}">${PMAP[id].ign}</div>`;
  }).join('');
  duo.querySelectorAll('[data-duo]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.duo;
    if(ui.duo.includes(id))ui.duo=ui.duo.filter(x=>x!==id);
    else{if(ui.duo.length>=2)ui.duo.shift();ui.duo.push(id);}
    renderTrain();
  });

  const fl=document.getElementById('focus-list');
  fl.innerHTML=S.roster.map(id=>{
    const p=PMAP[id];
    return `<div class="row" style="border-bottom:1px solid rgba(255,255,255,.05);padding:5px 0">
      <span style="width:110px;font-size:11.5px">${p.ign}</span>
      <select data-focus="${id}" style="background:#111a20;color:var(--ink);border:1px solid var(--line);padding:4px 6px;font-size:11px">
        <option value="rest">休息</option>
        ${ATTRS.map(([k,n])=>`<option value="${k}" ${ui.focus[id]===k?'selected':''}>${n}</option>`).join('')}
      </select></div>`;
  }).join('');
  fl.querySelectorAll('[data-focus]').forEach(sel=>sel.onchange=()=>{ui.focus[sel.dataset.focus]=sel.value;});
}
function mapPicker(){
  return `<div class="row">${MAPS.map(m=>`<span class="tag" data-map="${m}" style="cursor:pointer;padding:5px 9px">${m} <b style="color:var(--blue)">${Math.round(S.maps[m].fam)}</b></span>`).join('')}</div>`;
}

function renderTactics(){
  if(!S)return;
  const box=document.getElementById('sliders');
  const defs=[['tempo','节奏'],['aggr','侵略性'],['util','道具'],['mid','中局应变']];
  box.innerHTML=defs.map(([k,n])=>`<div class="slider"><div class="lab"><span>${n}</span><b>${S.sliders[k]}</b></div>
    <input type="range" min="0" max="100" value="${S.sliders[k]}" data-sl="${k}"></div>`).join('');
  box.querySelectorAll('[data-sl]').forEach(inp=>inp.oninput=()=>{
    S.sliders[inp.dataset.sl]=+inp.value;save();renderTactics();
  });
  const sh=shapeOf(S.starters);
  const fams=MAPS.map(m=>S.maps[m].fam);
  document.getElementById('shape-hint').innerHTML=`当前阵容：<b style="color:var(--gold)">${sh}</b> · 滑杆加成 <b>${tacBonus(MAPS[0]).toFixed(1)}</b>`;
  document.getElementById('maps').innerHTML=MAPS.map(m=>`<div class="maprow"><span>${m}</span><div class="bar"><i style="width:${S.maps[m].fam}%"></i></div><b>${Math.round(S.maps[m].fam)}</b></div>`).join('');
}

function renderSeason(){
  if(!S)return;
  hud();
  const total=LEAGUE_TEAMS(S.league).length-1;
  const title=document.getElementById('round-title'),acts=document.getElementById('round-actions');
  if(S.phase==='playoff'){title.textContent='季后赛';acts.innerHTML='';}
  else if(S.round>=total){
    title.textContent='常规赛结束 · '+S.standings[S.teamId].w+' 胜 '+S.standings[S.teamId].l+' 负';
    acts.innerHTML='<button class="btn primary" id="btn-po">进入季后赛</button>';
    document.getElementById('btn-po').onclick=enterPlayoffs;
  }else{
    const opp=currentOpponent();
    const t=opp?TMAP[opp]:null;
    title.innerHTML=`第 ${S.round+1} 轮 · vs <span style="color:var(--red)">${t?t.name:'待定'}</span>`;
    acts.innerHTML='<button class="btn primary" id="btn-play">开打</button>';
    document.getElementById('btn-play').onclick=playMatch;
  }
  document.getElementById('standings').innerHTML=sortedStandings().map((r,i)=>{
    const t=TMAP[r.id];const g=r.w+r.l||1;
    return `<tr class="${r.id===S.teamId?'me':''}"><td>${i+1}. ${t.name}</td><td class="num">${r.w}</td><td class="num">${r.l}</td><td class="num">${Math.round(r.w/g*100)}%</td></tr>`;
  }).join('');
}

function renderMarket(){
  if(!S)return;
  const rosterIds=new Set(S.roster);
  const fa=PLAYERS.filter(p=>!p.teamId&&!rosterIds.has(p.id)).sort((a,b)=>b.overall-a.overall).slice(0,36);
  document.getElementById('market-hint').textContent=`预算 ${money(S.budget)} 万 · 名单 ${S.roster.length}/7 · 签约价按身价（万元），声望越高越容易谈成`;
  document.getElementById('market').innerHTML=fa.map(p=>{
    const price=Math.round(p.value/10000);
    const c=ROLE_COLOR[p.role]||'#888';
    return `<div class="mrow"><div class="avatar" style="color:${c}">${p.ign.slice(0,2).toUpperCase()}</div>
      <div><div class="nm">${p.ign}</div><div class="sub"><span style="color:${c}">${p.role}</span> · ${p.age} 岁 · 综合 ${p.overall} · 潜力 ${p.potential}</div></div>
      <div><div class="price">${money(price)} 万</div><button class="btn" data-sign="${p.id}" style="margin-top:5px" ${(S.roster.length>=7||S.budget<price)?'disabled':''}>签下</button></div></div>`;
  }).join('')||'<div class="hint">没有可签的自由球员。</div>';
  document.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.sign,p=PMAP[id],price=Math.round(p.value/10000);
    if(S.budget<price||S.roster.length>=7)return;
    S.budget-=price;S.roster.push(id);S.dyn[id]=mkDyn(id);
    if(S.starters.length<5)S.starters.push(id);
    save();renderMarket();renderSquad();hud();
  });
}

function renderRoom(){
  if(!S)return;
  const ids=S.roster;
  let html='<div style="display:grid;grid-template-columns:86px repeat('+ids.length+',38px);gap:2px;align-items:center">';
  html+='<div></div>';
  ids.forEach(id=>html+=`<div class="relhead">${PMAP[id].ign.slice(0,4)}</div>`);
  ids.forEach((a,i)=>{
    html+=`<div class="relhead">${PMAP[a].ign.slice(0,5)}</div>`;
    ids.forEach((b,j)=>{
      if(i===j){html+='<div class="relcell" style="background:rgba(255,255,255,.02)"></div>';return;}
      const v=relOf(a,b);
      const col=v>=60?'rgba(46,230,197,.35)':v>=40?'rgba(46,230,197,.18)':v>=20?'rgba(255,255,255,.06)':v>=0?'rgba(255,140,80,.25)':'rgba(255,70,85,.35)';
      html+=`<div class="relcell" style="background:${col}">${Math.round(v)}</div>`;
    });
  });
  html+='</div>';
  document.getElementById('relgrid').innerHTML=html;

  document.getElementById('mood').innerHTML=ids.map(id=>{
    const d=S.dyn[id];
    return `<div class="mcard"><div class="n">${PMAP[id].ign}</div>
      <div class="r"><span>信任</span><b class="${d.trust<40?'bad':d.trust>75?'good':''}">${Math.round(d.trust)}</b></div>
      <div class="r"><span>忠诚</span><b>${Math.round(d.loyal)}</b></div>
      <div class="r"><span>不满</span><b class="${d.griev>40?'bad':''}">${Math.round(d.griev)}</b></div>
      <div class="r"><span>体能</span><b class="${d.fatigue>75?'bad':''}">${Math.round(100-d.fatigue)}</b></div></div>`;
  }).join('');
}

/* ---------- 弹窗 / 初始化 ---------- */
function showModal(html){document.getElementById('modal-box').innerHTML=html;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
document.getElementById('btn-start').onclick=startGame;
document.getElementById('btn-restart').onclick=()=>{
  if(!confirm('放弃当前存档？'))return;
  localStorage.removeItem(SAVE);S=null;location.reload();
};

S=load();
if(S){ui.view='squad';renderAll();}
else{ghostInit();hud();}

/* 预览钩子：?demo=squad|train|tactics|season|market|room */
var __q2 = new URLSearchParams(location.search);
if (__q2.get('demo')) {
  if (!S) { ui.origin = 'grass'; ui.team = TEAMS.find(t => t.tag === 'EDG').id; document.getElementById('in-name').value = '预览'; startGame(); }
  switchView(__q2.get('demo'));
}
/* 自测钩子 */
var __q=new URLSearchParams(location.search);
if(__q.get('test')){
  if(!S){ui.origin='grass';ui.team=TEAMS.find(t=>t.tag==='EDG').id;document.getElementById('in-name').value='测试';startGame();}
  window.addEventListener('error',e=>{document.title='ERR '+e.message;});
  (async()=>{
    try{
      for(let i=0;i<14&&S&&S.phase==='regular'&&S.round<LEAGUE_TEAMS(S.league).length-1;i++){
        applyTraining('review');await playMatch();await sleep(50);
      }
      if(S){enterPlayoffs();}
      document.title='TEST ok round='+(S?S.round:'-')+' trust='+(S?Math.round(S.trust):'-');
    }catch(e){document.title='TEST FAIL '+e.message;}
  })();
}
